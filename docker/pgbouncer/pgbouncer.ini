[databases]
nexus_db = host=db port=5432 dbname=nexus_db

[pgbouncer]
listen_port = 6432
listen_addr = *
auth_type = trust
auth_file = /etc/pgbouncer/userlist.txt
pool_mode = transaction

# Connection limits
max_client_conn = 1000
default_pool_size = 30
min_pool_size = 5
reserve_pool_size = 5
reserve_pool_timeout = 5
max_db_connections = 100

# Logging
log_connections = 1
log_disconnections = 1
log_pooler_errors = 1
